name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: palo
            archive: tar.gz
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: palo.exe
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release -p palo --target ${{ matrix.target }}

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail

          asset_dir="palo-${RELEASE_TAG}-${{ matrix.platform }}"
          mkdir -p "dist" "${asset_dir}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${asset_dir}/"
          cp README.md LICENSE "${asset_dir}/"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${asset_dir}' -DestinationPath 'dist/${asset_dir}.zip' -Force"
          else
            tar -czf "dist/${asset_dir}.tar.gz" "${asset_dir}"
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: palo-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: build macos-universal
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build x86_64 release binary
        run: cargo build --locked --release -p palo --target x86_64-apple-darwin

      - name: Build aarch64 release binary
        run: cargo build --locked --release -p palo --target aarch64-apple-darwin

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail

          asset_dir="palo-${RELEASE_TAG}-macos-universal"
          mkdir -p "dist" "${asset_dir}"
          lipo -create \
            "target/x86_64-apple-darwin/release/palo" \
            "target/aarch64-apple-darwin/release/palo" \
            -output "${asset_dir}/palo"
          chmod +x "${asset_dir}/palo"
          cp README.md LICENSE "${asset_dir}/"
          tar -czf "dist/${asset_dir}.tar.gz" "${asset_dir}"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: palo-macos-universal
          path: dist/*
          if-no-files-found: error

  publish-crates:
    name: publish crates.io
    runs-on: ubuntu-latest
    needs:
      - build
      - build-macos
    environment: Rust
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify release tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "palo") | .version')"
          expected_tag="v${version}"

          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match workspace version ${version}."
            exit 1
          fi

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Publish crates in dependency order
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN or CRATES_IO_TOKEN secret is not configured."
            exit 1
          fi

          crate_index_path() {
            local name="$1"
            local length="${#name}"

            if (( length == 1 )); then
              printf "1/%s" "${name}"
            elif (( length == 2 )); then
              printf "2/%s" "${name}"
            elif (( length == 3 )); then
              printf "3/%s/%s" "${name:0:1}" "${name}"
            else
              printf "%s/%s/%s" "${name:0:2}" "${name:2:2}" "${name}"
            fi
          }

          crate_version_exists() {
            local name="$1"
            local version="$2"
            local path
            path="$(crate_index_path "${name}")"

            curl --fail --silent "https://index.crates.io/${path}" 2>/dev/null \
              | grep --fixed-strings --quiet "\"vers\":\"${version}\""
          }

          wait_for_crate_version() {
            local name="$1"
            local version="$2"

            for _ in {1..30}; do
              if crate_version_exists "${name}" "${version}"; then
                return 0
              fi
              sleep 10
            done

            echo "${name} ${version} did not appear in the crates.io index in time."
            exit 1
          }

          publish_crate() {
            local package="$1"
            local name="$2"
            local version="$3"

            if crate_version_exists "${name}" "${version}"; then
              echo "${name} ${version} is already published; skipping."
              return 0
            fi

            cargo publish --package "${package}" --locked --dry-run
            cargo publish --package "${package}" --locked
            wait_for_crate_version "${name}" "${version}"
          }

          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "palo") | .version')"

          publish_crate "palo-core" "palo-core" "${version}"
          publish_crate "palo-projects" "palo-projects" "${version}"
          publish_crate "palo-tui" "palo-tui" "${version}"
          publish_crate "palo" "palo" "${version}"

  publish-github-release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build
      - build-macos
      - publish-crates
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHASUMS256.txt

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Palo ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
