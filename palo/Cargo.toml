[package]
name = "palo"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true
description = "Local development orchestration for multi-service applications"

[dependencies]
palo-core = { version = "0.5.1", path = "../palo-core" }
palo-tui = { version = "0.5.1", path = "../tui" }
projects = { package = "palo-projects", version = "0.5.1", path = "../projects" }
color-eyre = "0.6.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "1.6.0", features = ["transport-streamable-http-server"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.20.0"
