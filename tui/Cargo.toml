[package]
name = "palo-tui"
version.workspace = true
description = "tui for palo"
authors = ["Aldi Alimucaj <aldi.alimucaj@gmail.com>"]
license.workspace = true
edition.workspace = true
readme = "README.md"

[dependencies]
palo_core = { package = "palo-core", version = "0.5.1", path = "../palo-core" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
ratatui = "0.30.0"
tokio = { version = "1.40.0", features = ["full"] }
color-eyre = "0.6.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
