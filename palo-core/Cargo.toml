[package]
name = "palo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true
description = "Core orchestration engine for Palo local development environments"

[lib]
name = "palo_core"

[features]
default = []

[dependencies]
config = "0.15.22"
globset = "0.4.18"
notify = "8.2.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
shlex = "1.3.0"
tracing = "0.1.41"
humantime = "2.3.0"
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.16"
nix = { version = "0.31.2", features = ["signal", "process"] }
sysinfo = "0.39.1"
rmcp = "1.6.0"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }


[dev-dependencies]
tempfile = "3.20.0"
